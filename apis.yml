description: >-
  Codehooks is a JavaScript-native serverless backend platform that bundles a NoSQL document database, key-value store,
  persistent queues with workers, CRON jobs, blob storage, frontend hosting, and an automatic CRUD REST API in a single
  CLI-deployable runtime. Developers write small Node.js handler files and Codehooks generates a secure REST API,
  OpenAPI documentation, and event hooks (onBefore/onAfter Create/Read/Update/Delete) without managing servers. The
  platform targets agent-native and AI backend use cases where simple, fast, MongoDB-style data access and event-driven
  automation matter.
apis:
- aid: codehooks:codehooks-events
  name: Codehooks Events (AsyncAPI)
  tags:
  - Async
  - Events
  - Hooks
  - Lifecycle
  - Queues
  - Workers
  humanURL: https://codehooks.io/docs/hooks-and-workers
  properties:
  - url: https://codehooks.io/docs/hooks-and-workers
    type: Documentation
  - url: asyncapi/codehooks-events-asyncapi.yml
    type: AsyncAPI
  description: >-
    Asynchronous CRUD lifecycle hooks (onBeforeCreate, onAfterCreate, onBeforeRead, onAfterRead, onBeforeUpdate,
    onAfterUpdate, onBeforeDelete, onAfterDelete) and queue worker processing (onQueueJob) for serverless
    backend operations. AsyncAPI describes these as event-driven channels backed by an internal pub/sub
    and persistent queue runtime.
  x-features:
  - Eight CRUD lifecycle hooks (before/after for each verb)
  - Queue worker (onQueueJob) for deferred work
  - Automatic retry and persistent state on workers
  - CRON-triggered jobs with multi-schedule support
  - Stateful workflow orchestration
  x-use-cases:
  - Validation and transformation on writes
  - Audit logging and outbound webhooks
  - PDF/email generation deferred to a worker
  - AI inference pipelines triggered after document creation
  - Scheduled batch jobs (CRON)
